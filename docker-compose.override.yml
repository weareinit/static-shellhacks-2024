services:
  shellhacks:
    build:
      target: dev
    volumes:
      - ./shellhacks/src:/shellhacks/src
  backend:
    build:
      target: dev
    volumes:
      - ./backend/src:/backend/src
  nginx:
    image: nginx:latest
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    depends_on:
      - shellhacks
      - backend
    ports:
      - 80:80
