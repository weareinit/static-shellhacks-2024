version: "3.9"
services:
  backend:
    build:
      context: ./backend
    ports:
      - ${PORT}:${PORT}
      - ${NODEMON_PORT}:${NODEMON_PORT}
    environment:
      - NODE_ENV=development
    command:
      - nodemon
      - --inspect=0.0.0.0:9229
      - src/index.js
    volumes:
      - ./backend/src:/backend/src
    env_file:
      - ./backend.env
  shellhacks:
    build:
      context: ./shellhacks
    ports:
      - ${FRONTEND_PORT}:${FRONTEND_PORT}
    env_file:
      - ./frontend.env
    volumes:
      - ./shellhacks/src:/shellhacks/src
