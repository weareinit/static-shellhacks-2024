# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [gh-pages]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      - name: Rename assets
        run: node scripts/rename-assets.js
      - name: Build with Next.js
        env:
          NEXT_PUBLIC_BASE_PATH: /shell-24
          NODE_ENV: production
        run: npm run build:static
      - name: Prepare deployment directory
        run: |
          # Create base deployment directory
          mkdir -p deploy/shell-24
          
          # Create all required directories first
          mkdir -p deploy/shell-24/_next
          mkdir -p deploy/shell-24/assets
          mkdir -p deploy/shell-24/images
          mkdir -p deploy/shell-24/fonts
          
          # Copy the main files
          cp out/*.html deploy/shell-24/
          cp out/*.svg deploy/shell-24/
          cp out/favicon.png deploy/shell-24/
          
          # Copy directories with static assets
          cp -r out/_next/* deploy/shell-24/_next/
          cp -r out/assets/* deploy/shell-24/assets/
          cp -r out/images/* deploy/shell-24/images/
          cp -r out/fonts/* deploy/shell-24/fonts/
          
          echo "Deployment directory structure:"
          ls -la deploy/shell-24
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
